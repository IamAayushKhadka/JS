<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body style="background-color: #212121;">

    <!-- 0	UNSENT	Client has been created. open() not called yet.
    1	OPENED	open() has been called.
    2	HEADERS_RECEIVED	send() has been called, and headers and status are available.
    3	LOADING	Downloading; responseText holds partial data.
    4	DONE	The operation is complete. -->

    <div id="imageContainer"></div>
    <span id="insertText"></span>
    <button id="start">Start</button>




</body>
<script>
    // const requestUrl = "https://api.github.com/users/IamAayushKhadka"
    const requestUrl = "https://api.github.com/users/hiteshchoudhary"
    const xhr = new XMLHttpRequest()
    xhr.open('GET',requestUrl)
    xhr.onreadystatechange = function () {
        // console.log(xhr.readyState);
        if(xhr.readyState === 4) {
            const data = JSON.parse(this.responseText)
            // console.log( data);
            // console.log(data.followers);
            // console.log(data.avatar_url);

            const hiteshPhoto = data.avatar_url
            // console.log(hiteshPhoto);
            
            const followers = data.followers
            const insertFollowers = document.querySelector('#insertText')

            document.getElementById('start').addEventListener('click', (e) => {
                
                const img = document.createElement("img")
                img.src = hiteshPhoto
                img.alt = "Hitesh Avatar"
                img.height = 200
                
                document.getElementById('imageContainer').appendChild(img)


                insertFollowers.innerHTML = `<h1>Hitesh Followers : ${followers} </h1>`
            },false)
            
        }
    }
    xhr.send()


</script>
</html>
